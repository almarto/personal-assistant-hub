<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: oklch(97% 0.012 75);
      --surface: oklch(99% 0.006 75);
      --surface-2: oklch(95% 0.014 75);
      --text: oklch(23% 0.02 50);
      --text-secondary: oklch(45% 0.02 50);
      --primary: oklch(58% 0.16 45);
      --primary-strong: oklch(48% 0.17 45);
      --primary-wash: oklch(93% 0.03 45);
      --secondary: oklch(38% 0.09 310);
      --border: oklch(90% 0.012 75);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary); }
    a:hover { color: var(--primary-strong); }
    .screen {
      width: 390px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Archivo', system-ui, sans-serif;
      min-height: 1400px;
      padding-bottom: var(--space-xl);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg) var(--space-sm);
    }
    .wordmark { font-family: 'Instrument Serif', serif; font-size: 20px; }
    .menuBtn { background: none; border: none; padding: 4px; color: var(--text); cursor: pointer; display: flex; }
    .menuPanel { margin: 0 var(--space-lg) var(--space-md); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-sm); display: flex; flex-direction: column; gap: 2px; }
    .menuItem { padding: 10px var(--space-md); border-radius: var(--radius-md); font-size: 14px; font-weight: 600; color: var(--text-secondary); }
    .hero { padding: var(--space-sm) var(--space-lg) var(--space-md); }
    .heroLabel { font-family: 'Instrument Serif', serif; font-size: 34px; line-height: 1.05; margin: 0 0 var(--space-xs); }
    .heroMeta { display: flex; gap: var(--space-sm); align-items: center; }
    .chip {
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-2);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: 0 var(--space-lg);
    }
    .exCard {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
    }
    .exHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      cursor: pointer;
    }
    .exName { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .exMeta { font-size: 13px; color: var(--text-secondary); }
    .chevron { transition: transform 0.2s ease; flex: 0 0 auto; margin-left: var(--space-sm); }
    .exBody {
      padding: 0 var(--space-md) var(--space-md);
      border-top: 1px solid var(--border);
    }
    .lastTime {
      margin-top: var(--space-md);
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: 13px;
    }
    .lastTimeLabel {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .cue { font-size: 13px; color: var(--text-secondary); margin-top: var(--space-sm); line-height: 1.4; }
    .setRow {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-top: var(--space-sm);
    }
    .setNum { width: 20px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .setInput {
      flex: 1;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 0 10px;
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      color: var(--text);
    }
    .setCheck {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .notesBox {
      margin: var(--space-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
    }
    .notesLabel { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: var(--space-sm); }
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      padding: var(--space-sm);
      resize: none;
      color: var(--text);
    }
  </style>
</helmet>

<div class="screen">
  <div class="topbar">
    <span class="wordmark">wellness</span>
    <button class="menuBtn" onClick="{{toggleMenu}}" aria-label="Menú">
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </sc-if>
      <sc-if value="{{menuClosed}}" hint-placeholder-val="{{true}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
      </sc-if>
    </button>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
    <div class="menuPanel">
      <sc-for list="{{menuItems}}" as="mi" hint-placeholder-count="5">
        <div class="menuItem" style="{{mi.style}}">{{mi.label}}</div>
      </sc-for>
    </div>
  </sc-if>

  <div class="hero">
    <h1 class="heroLabel">Tren inferior A</h1>
    <div class="heroMeta">
      <span class="chip">60-90 min</span>
      <span class="chip">RIR 2</span>
    </div>
  </div>

  <div class="list">
    <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="6">
      <div class="exCard">
        <div class="exHead" onClick="{{ex.toggle}}">
          <div>
            <div class="exName">{{ex.name}}</div>
            <div class="exMeta">{{ex.seriesReps}} &middot; descanso {{ex.rest}} &middot; tempo {{ex.tempo}}</div>
          </div>
          <svg class="chevron" style="{{ex.chevronStyle}}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
        <sc-if value="{{ex.open}}" hint-placeholder-val="{{true}}">
          <div class="exBody">
            <div class="lastTime">
              <div class="lastTimeLabel">Última vez</div>
              <div>{{ex.lastTime}}</div>
            </div>
            <div class="cue">{{ex.cue}}</div>
            <sc-for list="{{ex.sets}}" as="s" hint-placeholder-count="4">
              <div class="setRow">
                <span class="setNum">{{s.num}}</span>
                <input class="setInput" type="number" placeholder="{{s.weightPlaceholder}}">
                <input class="setInput" type="number" placeholder="{{s.repsPlaceholder}}">
                <button class="setCheck" onClick="{{s.toggle}}" style="{{s.checkStyle}}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>
                </button>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div class="notesBox">
    <div class="notesLabel">Notas de la sesión</div>
    <textarea rows="3" placeholder="Energía, molestias, cómo ha ido..."></textarea>
  </div>
</div>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: 0, done: {}, menuOpen: false };
  }

  toggleExpand(i) {
    this.setState({ expanded: this.state.expanded === i ? -1 : i });
  }

  toggleMenu() {
    this.setState({ menuOpen: !this.state.menuOpen });
  }

  toggleSet(key) {
    const done = Object.assign({}, this.state.done);
    done[key] = !done[key];
    this.setState({ done: done });
  }

  renderVals() {
    const DATA = [
      { name: "Sentadilla goblet", seriesReps: "4 x 12-18", rest: "90 s", tempo: "3-1-1-0",
        cue: "Mancuerna pegada al pecho; rodillas siguen la línea de los pies.",
        lastTime: "16 kg x 16, 15, 14, 13 reps", weight: "16", setsCount: 4 },
      { name: "Sentadilla búlgara", seriesReps: "3 x 12-16/lado", rest: "90 s", tempo: "3-1-1-0",
        cue: "Pie trasero en banco; rango estable, sin rebote.",
        lastTime: "14 kg x 14, 13, 12 reps/lado", weight: "14", setsCount: 3 },
      { name: "Peso muerto rumano con barra", seriesReps: "4 x 12-18", rest: "90 s", tempo: "3-1-1-1",
        cue: "Cadera atrás; barra cerca de las piernas.",
        lastTime: "20 kg x 15, 14, 13, 12 reps", weight: "20", setsCount: 4 },
      { name: "Elevación de gemelos de pie", seriesReps: "4 x 15-20", rest: "60 s", tempo: "3-1-1-2",
        cue: "Apoyo estable; pausa arriba y estiramiento controlado.",
        lastTime: "10 kg x 18, 18, 17, 16 reps", weight: "10", setsCount: 4 },
      { name: "Dead bug", seriesReps: "3 x 8-12/lado", rest: "45 s", tempo: "2-1-2-1",
        cue: "Zona lumbar pegada al suelo.",
        lastTime: "sin peso x 10, 10, 9 reps/lado", weight: "", setsCount: 3 },
      { name: "Plancha lateral", seriesReps: "3 x 25-40 s/lado", rest: "45 s", tempo: "Isométrico",
        cue: "Cadera alta y cuerpo alineado.",
        lastTime: "35, 32, 30 s/lado", weight: "", setsCount: 3 }
    ];

    const doneMap = this.state.done;
    const exercises = DATA.map((ex, i) => {
      const open = this.state.expanded === i;
      const sets = [];
      for (let s = 0; s < ex.setsCount; s++) {
        const key = i + "-" + s;
        const isDone = !!doneMap[key];
        sets.push({
          num: s + 1,
          weightPlaceholder: ex.weight ? ex.weight + " kg" : "kg",
          repsPlaceholder: "reps",
          checkStyle: isDone ? "background: var(--primary); color: white;" : "background: var(--surface-2); color: var(--text-secondary);",
          toggle: () => this.toggleSet(key)
        });
      }
      return {
        name: ex.name,
        seriesReps: ex.seriesReps,
        rest: ex.rest,
        tempo: ex.tempo,
        cue: ex.cue,
        lastTime: ex.lastTime,
        open: open,
        chevronStyle: open ? "transform: rotate(90deg);" : "transform: rotate(0deg);",
        sets: sets,
        toggle: () => this.toggleExpand(i)
      };
    });

    const menuItems = ["Hoy", "Entreno", "Cocinar", "Compra", "Medidas"].map((label) => ({
      label: label,
      style: label === "Entreno" ? "background: var(--primary-wash); color: var(--primary-strong);" : ""
    }));

    return {
      exercises: exercises,
      menuOpen: this.state.menuOpen,
      menuClosed: !this.state.menuOpen,
      toggleMenu: () => this.toggleMenu(),
      menuItems: menuItems
    };
  }
}
</script>
</x-dc>
</body>
</html>
