name: Security

# Both jobs are required checks on main, so they gate every PR. The weekly run
# repeats them over the whole history. The audit only fails on critical
# advisories, so a new one blocks every PR until it's fixed, which is intended;
# Dependabot alerts cover the lower severities. A failed scheduled run emails
# the repo owner.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A new push to the same PR cancels the run that's still going. The event is in
# the group so a manual run on main can't cancel the weekly one, or the reverse.
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved to other code.
# To update one, take the new release's commit and keep its version in the comment.

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary, checked against its published checksum. The
      # gitleaks action would need the job's GitHub token; this needs nothing.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      # A PR answers for its own commits only: scanning every branch would let
      # one stale branch fail all PRs. Other runs take the whole history, since
      # a secret removed in a later commit is still leaked.
      - name: Scan the git history
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || '--full-history --all' }}
        run: ./gitleaks git --log-opts="$LOG_OPTS" --redact --verbose --no-banner

  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Reads the lockfile, so no install is needed.
      - run: pnpm audit --prod --audit-level=critical
