name: CI

# This repo commits straight to main, so main is checked as well as PRs.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved to other code.
# To update one, take the new release's commit and keep its version in the comment.

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc` needs Next's generated route types (.next/types), which a fresh
      # checkout doesn't have yet.
      - name: Generate Next route types
        run: pnpm exec next typegen

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # Both are read when modules load, so the build fails without them. It
      # never uses them: these are placeholders, not credentials.
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-only-not-a-secret
          RESEND_API_KEY: ci-only-not-a-secret
