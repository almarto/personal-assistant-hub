version: 2

# Minor and patch bumps arrive as one grouped PR, security fixes as another, and
# each major bump alone so it can be judged on its own. The cooldown skips
# releases too new to trust; security updates ignore it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 10
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
